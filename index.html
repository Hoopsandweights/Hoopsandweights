<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Free basketball training plans: drills, court diagrams and gym workouts for players U14 to adult. Built by a licensed coach.">
<meta property="og:title" content="HoopsandWeights Trainer">
<meta property="og:description" content="Your personal basketball and gym plan. Drills, court diagrams and workouts for every level.">
<meta name="theme-color" content="#D9581A">
<title>HoopsandWeights Trainer</title>
<style>
:root { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; font: 14px system-ui, -apple-system, "Segoe UI", sans-serif; }
img { max-width: 100%; }
[hidden] { display: none !important; }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: phone-first single column app, sticky top bar, fixed bottom tab bar; court diagrams drawn as SVG from drill data */
:root {
  --bg: #EEF1F4;
  --surface: #FFFFFF;
  --surface-2: #E3E8ED;
  --fg: #16202B;
  --muted: #5B6875;
  --line: #C9D2DB;
  --court: #F6E7D3;
  --court-line: #B9865A;
  --accent: #D9581A;
  --accent-ink: #FFFFFF;
  --ok: #1F8A5B;
  --ok-soft: #DDF1E7;
  --warn: #9A6400;
  --warn-soft: #F7EACB;
  --f-display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --f-body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-label: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1419; --surface: #19202A; --surface-2: #232C38; --fg: #ECEFF3; --muted: #95A2B0;
    --line: #2F3A47; --court: #2A2219; --court-line: #9C7552; --accent: #F0763A; --accent-ink: #1A0E07;
    --ok: #4CC48D; --ok-soft: #173326; --warn: #E8B44A; --warn-soft: #3A2E14; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1419; --surface: #19202A; --surface-2: #232C38; --fg: #ECEFF3; --muted: #95A2B0;
  --line: #2F3A47; --court: #2A2219; --court-line: #9C7552; --accent: #F0763A; --accent-ink: #1A0E07;
  --ok: #4CC48D; --ok-soft: #173326; --warn: #E8B44A; --warn-soft: #3A2E14; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 16px; line-height: 1.45; }
.app { max-width: 560px; margin: 0 auto; padding-inline: 16px; padding-block: 0 110px; }

header.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--bg); display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding-block: 14px 10px; border-bottom: 1px solid var(--line);
}
.brand { font-family: var(--f-display); font-weight: 900; font-size: 1.7rem; letter-spacing: .01em; line-height: 1; text-transform: uppercase; }
.brand span { color: var(--accent); }
.sub { font-family: var(--f-label); font-size: .78rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-top: 3px; }
.hdr-right { display: flex; align-items: center; gap: 8px; }
.langbtn { font-family: var(--f-label); font-weight: 700; font-size: .9rem; letter-spacing: .06em; padding: 6px 10px; border-radius: 999px;
  border: 1.5px solid var(--accent); background: transparent; color: var(--accent); cursor: pointer; }
.langbtn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
@media (max-width: 420px) { #streakTxt { display: none; } }
.streak { font-family: var(--f-label); font-weight: 700; font-size: .9rem; letter-spacing: .04em; text-transform: uppercase;
  background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; white-space: nowrap; }
.streak b { color: var(--accent); font-variant-numeric: tabular-nums; }

h2 { font-family: var(--f-display); font-weight: 800; font-size: 2rem; line-height: 1; text-transform: uppercase; margin: 0; text-wrap: balance; }
.eyebrow { font-family: var(--f-label); font-weight: 600; font-size: .8rem; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); }
section.view { display: flex; flex-direction: column; gap: 16px; padding-top: 20px; }

.hero { display: flex; flex-direction: column; gap: 8px; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 14px; font-family: var(--f-label); font-size: .95rem; color: var(--muted); letter-spacing: .03em; text-transform: uppercase; }
.bar { height: 8px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 999px; transition: width .3s ease; }
.done-banner { background: var(--ok-soft); color: var(--ok); border-radius: var(--r); padding: 12px 14px; font-weight: 600; }

.drills { display: flex; flex-direction: column; gap: 10px; }
.drill { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.drill.complete { border-color: var(--ok); }
.drill-head { width: 100%; display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; text-align: left;
  background: none; border: 0; color: inherit; font: inherit; padding: 14px; cursor: pointer; }
.drill-head:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.drill-name { font-weight: 600; font-size: 1.05rem; min-width: 0; }
.drill-dose { font-family: var(--f-label); color: var(--muted); font-size: .95rem; letter-spacing: .02em; }
.count { font-family: var(--f-label); font-weight: 700; font-variant-numeric: tabular-nums; font-size: 1rem; color: var(--muted); grid-row: span 2; }
.drill.complete .count { color: var(--ok); }
.drill-body { padding: 0 14px 14px; display: flex; flex-direction: column; gap: 12px; }
.court { background: var(--court); border-radius: 10px; overflow: hidden; }
.court svg { display: block; width: 100%; height: auto; }
.cues { margin: 0; padding-left: 18px; color: var(--muted); display: flex; flex-direction: column; gap: 4px; }
.sets { display: flex; flex-wrap: wrap; gap: 8px; }
.set { min-width: 64px; padding: 10px 12px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface-2); color: var(--fg);
  font-family: var(--f-label); font-weight: 700; font-size: .95rem; letter-spacing: .04em; text-transform: uppercase; cursor: pointer; }
.set[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.gymtable { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.gymtable td { padding: 6px 0; border-bottom: 1px solid var(--line); }
.gymtable td:last-child { text-align: right; font-family: var(--f-label); font-weight: 600; }

.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; }
.chip { flex: none; padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--fg);
  font-family: var(--f-label); font-weight: 600; letter-spacing: .05em; text-transform: uppercase; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.lib { display: flex; flex-direction: column; gap: 10px; }
.wcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; align-items: center; }
.wcard h3 { margin: 0; font-family: var(--f-display); font-weight: 800; font-size: 1.35rem; text-transform: uppercase; line-height: 1.05; }
.wcard p { margin: 0; color: var(--muted); font-size: .95rem; grid-column: 1 / -1; }
.tag { font-family: var(--f-label); font-weight: 700; font-size: .75rem; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); }
.btn { padding: 10px 14px; border-radius: 10px; border: 0; background: var(--accent); color: var(--accent-ink); font-family: var(--f-label);
  font-weight: 700; font-size: .95rem; letter-spacing: .05em; text-transform: uppercase; cursor: pointer; white-space: nowrap; }
.btn.ghost { background: var(--surface-2); color: var(--fg); }

.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; background: var(--surface-2); border-radius: 12px; padding: 4px; }
.seg button { border: 0; background: none; color: var(--muted); padding: 10px; border-radius: 9px; cursor: pointer;
  font-family: var(--f-label); font-weight: 700; letter-spacing: .06em; text-transform: uppercase; font-size: .95rem; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); }
.seg b { font-variant-numeric: tabular-nums; color: var(--accent); margin-left: 4px; }
.search { width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); font: inherit; }
.search::placeholder { color: var(--muted); }
.search:focus-visible { outline: 3px solid var(--accent); outline-offset: 1px; }
.dtag { font-family: var(--f-label); font-size: .85rem; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
.dtag em { font-style: normal; color: var(--accent); font-weight: 700; }
/* Onboarding */
.steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.steps i { height: 5px; border-radius: 999px; background: var(--surface-2); }
.steps i.on { background: var(--accent); }
.q-help { margin: 0; color: var(--muted); }
.opts { display: grid; gap: 10px; }
.opts.two { grid-template-columns: 1fr 1fr; }
.opt { text-align: left; padding: 16px; border-radius: var(--r); border: 1.5px solid var(--line); background: var(--surface); color: var(--fg);
  font: inherit; cursor: pointer; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.opt strong { font-family: var(--f-display); font-weight: 800; font-size: 1.5rem; text-transform: uppercase; line-height: 1.05; }
.opt span { color: var(--muted); font-size: .92rem; }
.opt[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1.5px var(--accent); }
.opt[aria-pressed="true"] strong { color: var(--accent); }
.nav-row { display: flex; gap: 10px; justify-content: space-between; }
.nav-row .btn { flex: 1; padding: 14px; }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.profile { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--r); padding: 10px 12px; }
.profile div { min-width: 0; font-family: var(--f-label); font-weight: 600; letter-spacing: .03em; text-transform: uppercase; font-size: .9rem; }
.profile small { display: block; color: var(--muted); font-weight: 500; }
.linkbtn { background: none; border: 0; color: var(--accent); font-family: var(--f-label); font-weight: 700; letter-spacing: .06em;
  text-transform: uppercase; cursor: pointer; padding: 6px; }
.plan { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; }
.pday { flex: none; width: 128px; text-align: left; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface);
  color: var(--fg); cursor: pointer; font: inherit; display: flex; flex-direction: column; gap: 2px; }
.pday small { font-family: var(--f-label); font-weight: 700; letter-spacing: .1em; color: var(--muted); font-size: .75rem; }
.pday span { font-weight: 600; font-size: .92rem; line-height: 1.2; }
.pday[aria-pressed="true"] { border-color: var(--accent); background: var(--accent); color: var(--accent-ink); }
.pday[aria-pressed="true"] small { color: inherit; opacity: .85; }
.tip { background: var(--surface-2); border-radius: 12px; padding: 10px 12px; font-size: .92rem; }
.tip.warn { background: var(--warn-soft); color: var(--warn); }
.opts.four { grid-template-columns: repeat(3, 1fr); }
.opts.days { grid-template-columns: repeat(4, 1fr); }
.opt.day-opt, .opt.count-opt { align-items: center; text-align: center; padding: 14px 6px; }
.opt.count-opt { position: relative; padding-bottom: 26px; }
.opt .rec { position: absolute; left: 6px; right: 6px; bottom: 6px; font-style: normal; font-family: var(--f-label); font-weight: 700; font-size: .68rem;
  letter-spacing: .06em; text-transform: uppercase; color: var(--ok); }
.pday.team { cursor: default; background: transparent; border-style: dashed; color: var(--muted); }
.foryou { color: var(--ok); }
.lv { display: inline-block; padding: 1px 7px; border-radius: 999px; font-weight: 700; font-size: .72rem; letter-spacing: .08em; vertical-align: 1px; }
.lv-B { background: var(--ok-soft); color: var(--ok); }
.lv-I { background: var(--warn-soft); color: var(--warn); }
.lv-A { background: var(--accent); color: var(--accent-ink); }
.chip.sub { padding: 6px 12px; font-size: .85rem; }
.chip.sub[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.empty { text-align: center; color: var(--muted); padding: 24px 0; }
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.day { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 0; text-align: center; font-family: var(--f-label); font-weight: 600; }
.day small { display: block; color: var(--muted); font-size: .75rem; letter-spacing: .08em; }
.day.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.day.on small { color: inherit; opacity: .8; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; }
.stat b { display: block; font-family: var(--f-display); font-weight: 900; font-size: 2rem; line-height: 1; font-variant-numeric: tabular-nums; }
.stat span { font-family: var(--f-label); color: var(--muted); font-size: .8rem; letter-spacing: .06em; text-transform: uppercase; }
.note { font-size: .85rem; color: var(--muted); }
.split { display: flex; flex-direction: column; gap: 8px; }
.split-row { display: grid; grid-template-columns: 90px 1fr 38px; gap: 10px; align-items: center; font-family: var(--f-label); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; font-size: .9rem; }
.split-row .bar { height: 10px; }
.split-row em { font-style: normal; text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }

nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line);
  padding: 8px 16px calc(8px + env(safe-area-inset-bottom, 0px)); }
nav.tabs .inner { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
nav.tabs button { background: none; border: 0; color: var(--muted); padding: 10px 4px; border-radius: 10px; cursor: pointer;
  font-family: var(--f-label); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; font-size: .95rem; }
nav.tabs button[aria-selected="true"] { color: var(--fg); background: var(--surface-2); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }


/* ---- Logging, weekly plan, progress ---- */
.newweek { background: var(--surface); border: 1.5px solid var(--accent); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; gap: 8px; }
.newweek ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; }
.newweek p { margin: 0; color: var(--muted); font-size: .92rem; }
.newweek .btn { align-self: flex-start; }
.pday.done:not([aria-pressed="true"]) { border-color: var(--ok); }
.pday.done:not([aria-pressed="true"]) span { color: var(--ok); }
.pday.today { box-shadow: inset 0 -3px 0 var(--accent); }
.done-banner { display: flex; flex-direction: column; gap: 8px; }
.done-banner small { color: var(--muted); font-weight: 500; }
.rate { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.ratebtn { padding: 10px 4px; border-radius: 10px; border: 1.5px solid var(--ok); background: var(--surface); color: var(--fg); cursor: pointer;
  font-family: var(--f-label); font-weight: 700; font-size: .85rem; letter-spacing: .03em; text-transform: uppercase; }
.ratebtn[aria-pressed="true"] { background: var(--ok); color: var(--surface); }
.btn.wide { width: 100%; padding: 14px; }
.day.miss { color: var(--muted); background: var(--surface-2); }
.day.planned { border-color: var(--accent); color: var(--accent); }
.day.teamd { border-style: dashed; color: var(--muted); }
.day.now { outline: 2px solid var(--fg); outline-offset: 1px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-family: var(--f-label); font-size: .78rem; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.lg { width: 12px; height: 12px; border-radius: 3px; border: 1.5px solid var(--line); display: inline-block; }
.lg.on { background: var(--accent); border-color: var(--accent); }
.lg.planned { border-color: var(--accent); }
.lg.miss { background: var(--surface-2); }
.lg.teamd { border-style: dashed; }
.stat b { white-space: nowrap; }
.lvlist { display: flex; flex-direction: column; gap: 6px; }
.lvrow { display: flex; justify-content: space-between; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; font-weight: 600; }
.lvrow .lv { font-family: var(--f-label); text-transform: uppercase; }
.hist { display: flex; flex-direction: column; gap: 8px; }
.histrow { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
.histrow > div:first-child { display: flex; justify-content: space-between; gap: 10px; font-family: var(--f-label); text-transform: uppercase; letter-spacing: .04em; }
.histrow span { color: var(--muted); }
.histrow small { color: var(--accent); font-family: var(--f-label); font-weight: 600; letter-spacing: .03em; }

/* ---- Dev time-travel bar (only with #dev) ---- */
.devbar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 10px; padding: 8px 10px; border-radius: 12px;
  border: 1.5px dashed var(--warn); background: var(--warn-soft); color: var(--warn); font-family: var(--f-label); font-weight: 600; font-size: .85rem; letter-spacing: .03em; }
.devbar span { flex: 1 1 100%; }
.devbar button { border: 1px solid var(--warn); background: var(--surface); color: var(--fg); border-radius: 8px; padding: 6px 10px; cursor: pointer;
  font-family: var(--f-label); font-weight: 700; font-size: .85rem; }
/* ---- Responsive tuning: small phones up to tablets ---- */
html, body { overflow-x: clip; }
button, .opt, .chip, .pday { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
header.top > div:first-child { min-width: 0; }
.hdr-right { flex-shrink: 0; }
.brand { font-size: clamp(1.25rem, 5.6vw, 1.7rem); white-space: nowrap; }
.sub { font-size: clamp(.68rem, 2.8vw, .78rem); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
h2 { font-size: clamp(1.55rem, 7vw, 2.3rem); overflow-wrap: anywhere; }
.steps { grid-template-columns: none; grid-auto-flow: column; grid-auto-columns: 1fr; }
.opt strong { font-size: clamp(1.1rem, 5vw, 1.5rem); overflow-wrap: anywhere; }
.opt span { font-size: clamp(.82rem, 3.4vw, .92rem); }
.opts.four { grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); }
.opt .rec { font-size: .6rem; letter-spacing: .03em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chips { flex-wrap: wrap; overflow: visible; }
.plan { scroll-snap-type: x proximity; -webkit-overflow-scrolling: touch; margin-inline: -16px; padding-inline: 16px; scroll-padding-inline: 16px; }
.pday { scroll-snap-align: start; }
.split-row { grid-template-columns: 7.2rem 1fr 38px; font-size: .84rem; }
.split-row span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.stat b { font-size: clamp(1.5rem, 7vw, 2rem); }
.stat span { font-size: clamp(.68rem, 2.8vw, .8rem); }
nav.tabs button { font-size: clamp(.74rem, 3.4vw, .95rem); letter-spacing: .04em; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-inline: 2px; }
@media (max-width: 360px) {
  .streak { display: none; }
  .opt .rec { font-size: .56rem; letter-spacing: 0; text-overflow: clip; }
  nav.tabs button { letter-spacing: 0; font-size: .74rem; }
  .app { padding-inline: 12px; }
  .drill-head, .drill-body { padding-inline: 12px; }
  .opts.days { grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .opt.day-opt { padding: 12px 4px; }
}
@media (min-width: 700px) {
  .app { max-width: 760px; }
  nav.tabs .inner { max-width: 760px; }
  .opts.two { grid-template-columns: repeat(3, 1fr); }
  .opts.days { grid-template-columns: repeat(7, 1fr); }
  .opts.four { grid-template-columns: repeat(6, 1fr); }
  .lib { display: grid; grid-template-columns: 1fr 1fr; align-items: start; }
  .lib > .drills, .lib > .empty { grid-column: 1 / -1; }
  .plan { flex-wrap: wrap; overflow: visible; margin-inline: 0; padding-inline: 0; }
  .pday { width: calc((100% - 24px) / 4); }
}
@media (min-width: 1100px) {
  .app { max-width: 900px; }
  nav.tabs .inner { max-width: 900px; }
}
</style>
</head>
<body>

<div class="app">
  <header class="top">

function makeSession(type, p, occ, idx, used, seed) {
  const t = TYPES[type];
  const main = lvlOf(p, type);
  const warm = DOWN[main];
  const rec = t.rec || (main === "Beginner" ? [[t.cat, null, "main", 3]] : [[t.cat, null, "warm", 1], [t.cat, null, "main", 3]]);
  const ids = [];
  const take = (cat, muscle, lvl, n) => {
    const list = ALL_DRILLS.filter(d => !d.wId && d.cat === cat && (!muscle || d.muscle === muscle) && d.lvl === lvl);
    if (!list.length) return;
    const key = cat + "|" + muscle + "|" + lvl;
    // The week number shifts the starting drill, so every week brings different drills
    let start = used[key] === undefined ? seed : used[key], got = 0;
    for (let k = 0; got < n && k < list.length; k++) {
      const d = list[(start + k) % list.length];
      if (!ids.includes(d.id)) { ids.push(d.id); got++; }
    }
    used[key] = start + n;
  };
  rec.forEach(([cat, muscle, which, n]) => take(cat, muscle, which === "main" ? main : which === "warm" ? warm : which, n));
  let challenge = false;
  if (occ >= 1 && UP[main] && p.age !== "U14") {
    const r = rec.find(x => x[2] === "main");

    min: ids.length * 10 + 5, blurb: BLURB[main] + (challenge ? " Plus one step-up drill to stretch you." : ""), drillIds: ids };
}

function spread(cands, n) {
  if (n <= 0) return [];
  if (n >= cands.length) return [...cands];
  return Array.from({ length: n }, (_, i) => cands[Math.floor(i * cands.length / n)]);
}

function buildPlan(p, seed = 0) {
  const team = p.team || [], gym = p.gym || 0, solo = p.solo || 0;
  const free = WEEK.filter(d => !team.includes(d));
  let gymDays = spread(free, gym);
  if (gym > gymDays.length) gymDays = gymDays.concat(spread(team, gym - gymDays.length));
  const open = free.filter(d => !gymDays.includes(d));
  let soloDays = spread(open, solo);
  if (solo > soloDays.length) soloDays = soloDays.concat(spread(gymDays.filter(d => !soloDays.includes(d)), solo - soloDays.length));
  if (solo > soloDays.length) soloDays = soloDays.concat(spread(team.filter(d => !soloDays.includes(d)), solo - soloDays.length));

  const has = (f) => p.focus.includes(f), young = isYoung(p.age);
  const gymTypes = young ? (has("bounce") ? ["bounce", "base"] : ["base", "bounce"])
    : has("bounce") && !has("strength") ? ["bounce", "lower", "upper"]
    : has("bounce") ? ["lower", "upper", "bounce"] : ["lower", "upper"];
  let courtTypes = p.focus.filter(f => COURT[f]);
  if (!courtTypes.length) courtTypes = ["handles", "shoot"];

  const seen = {}, gen = [], used = {}, entries = [];
  const add = (day, type, kind) => {
    const occ = seen[type] || 0; seen[type] = occ + 1;
    const fixed = TYPES[type].fixed;
    const fixedOk = fixed && !(young && W.find(w => w.id === fixed).level.startsWith("U18"));
    // Every other week the second slot uses the ready-made session for variety
    if (occ === 1 && fixedOk && seed % 2 === 0) return entries.push({ day, id: fixed, kind, type });
    const s = makeSession(type, p, occ, gen.length + "-" + kind, used, seed);
    gen.push(s); entries.push({ day, id: s.id, kind, type });
  };
  team.forEach(day => entries.push({ day, kind: "team" }));
  gymDays.forEach((day, i) => add(day, gymTypes[i % gymTypes.length], "gym"));
  soloDays.forEach((day, i) => add(day, courtTypes[i % courtTypes.length], "court"));
  const order = { team: 0, court: 1, gym: 2 };
  entries.sort((a, b) => WEEK.indexOf(a.day) - WEEK.indexOf(b.day) || order[a.kind] - order[b.kind]);
  return { plan: entries, gen };
}

const DAY_MS = 864e5;
// Dev time travel: shifts "today" by whole days (only visible in dev mode)
const now = () => new Date(Date.now() + (state.dayOffset || 0) * DAY_MS);
const ymd = (d) => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
const todayIdx = () => (now().getDay() + 6) % 7;
function weekInfo(d = now()) {
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  t.setUTCDate(t.getUTCDate() - ((t.getUTCDay() + 6) % 7) + 3); // Thursday of this week
  const y = t.getUTCFullYear(), jan4 = new Date(Date.UTC(y, 0, 4));
  const n = 1 + Math.round(((t - jan4) / DAY_MS - 3 + ((jan4.getUTCDay() + 6) % 7)) / 7);
  return { key: y + "-W" + String(n).padStart(2, "0"), n, seed: Math.floor(t / (7 * DAY_MS)) };
}
const weekNum = (key) => key ? +key.split("-W")[1] : "";
const TYPE_LABEL = { handles: ["Ball handling", "Ballhandling"], shoot: ["Shooting", "Wurf"], finish: ["Finishing", "Abschluss"],
  defense: ["Defense", "Verteidigung"], lower: ["Lower body", "Unterkörper"], upper: ["Upper body", "Oberkörper"],

const W_TYPE = { handles: "handles", shoot: "shoot", finish: "finish", defense: "defense", legs: "lower", upper: "upper", arms: "upper", plyo: "bounce" };

const slot = () => state.activeIdx >= 0 && state.plan[state.activeIdx] && state.plan[state.activeIdx].id === state.active ? "p" + state.activeIdx : "w" + state.active;
const slotType = () => {
  const e = state.plan[state.activeIdx];
  if (e && e.id === state.active && e.type) return e.type;
  return W_TYPE[state.active] || (getW(state.active).type) || "handles";
};
const doneKey = (id) => slot() + "|" + id;
const logFor = (s) => state.log.find(l => l.wk === state.weekKey && l.slot === s);

function syncLog() {
  const w = getW(state.active), s = slot();
  const total = w.drills.reduce((a, d) => a + d.sets, 0);
  const done = w.drills.reduce((a, d) => a + Math.min(state.done[doneKey(d.id)] || 0, d.sets), 0);
  const existing = logFor(s);
  if (done >= total && !existing) {
    state.log.push({ d: ymd(now()), wk: state.weekKey, slot: s, type: slotType(), cat: w.cat, name: w.name, min: w.min, rating: null });
  } else if (done < total && existing) {
    state.log = state.log.filter(l => l !== existing);
  }
  if (state.log.length > 600) state.log = state.log.slice(-600);
}

function adaptLevels(prevPlan, logs) {
  const p = state.profile, changes = [];
  const types = [...new Set(prevPlan.filter(x => x.type).map(x => x.type))];
  types.forEach(type => {
    const planned = prevPlan.filter(x => x.type === type).length;
    const ls = logs.filter(l => l.type === type), rated = ls.filter(l => l.rating);
    const easy = rated.filter(l => l.rating === "easy").length, hard = rated.filter(l => l.rating === "hard").length;
    const from = lvlOf(p, type), i = LV_LIST.indexOf(from);
    let to = from, why = "same";
    if (hard > 0 && hard * 2 >= rated.length) { if (i > 0) to = LV_LIST[i - 1]; why = "hard"; }
    else if (easy > 0 && easy * 2 >= rated.length && ls.length >= Math.ceil(planned * 0.75)) { to = capLvl(p, LV_LIST[Math.min(i + 1, 2)]); why = "easy"; }
    else if (planned > 0 && ls.length === 0) why = "missed";
    state.levels[type] = to;
    changes.push({ type, from, to, why, done: ls.length, planned });
  });
  return changes;
}

function pickDefault() {
  const t = todayIdx();
  const all = state.plan.map((x, i) => ({ x, i })).filter(o => o.x.kind !== "team");
  const open = all.filter(o => !logFor("p" + o.i));
  const pick = open.find(o => WEEK.indexOf(o.x.day) === t) || open.find(o => WEEK.indexOf(o.x.day) > t) || open[0] || all[0];
  if (pick) { state.activeIdx = pick.i; state.active = pick.x.id; const w = getW(state.active); state.open = w.drills[0] ? w.drills[0].id : null; }
}

function newPlanFor(week) {
  const built = buildPlan(state.profile, week.seed);
  state.plan = built.plan; state.gen = built.gen; state.weekKey = week.key; state.done = {};
  pickDefault();
}

function weekRoll() {
  const cur = weekInfo();
  if (!state.profile) return;
  const outdated = state.plan.some(x => x.kind !== "team" && !x.type);
  if (state.weekKey === cur.key && state.plan.length && !outdated) return;
  if (state.weekKey && state.weekKey !== cur.key && !outdated) {
    const logs = state.log.filter(l => l.wk === state.weekKey);
    const changes = adaptLevels(state.plan, logs);
    state.history.unshift({ key: state.weekKey, planned: state.plan.filter(x => x.kind !== "team").length,
      done: logs.length, min: logs.reduce((a, l) => a + l.min, 0), changes });
    state.history = state.history.slice(0, 26);
    state.changes = changes; state.changesSeen = false;
  }
  newPlanFor(cur);
  save();
}

function streak() {
  const days = new Set(state.log.map(l => l.d));
  const d = now();
  if (!days.has(ymd(d))) d.setDate(d.getDate() - 1);
  let n = 0;
  while (days.has(ymd(d))) { n++; d.setDate(d.getDate() - 1); }
  return n;
}

function recGym(p) {
  if (p.age === "U14") return { n: 1, why: L("At this age one session of jumps and bodyweight strength is plenty.", "In diesem Alter reicht eine Einheit mit Sprüngen und Übungen mit dem eigenen Körpergewicht.") };
  if (p.age === "U16") return { n: 2, why: L("Two short sessions build a base and help prevent injuries. Bodyweight and light weights only.", "Zwei kurze Einheiten bauen eine Basis auf und beugen Verletzungen vor. Nur Körpergewicht und leichte Gewichte.") };
  if (p.age === "U18") return { n: 2, why: L("Two full-body sessions build strength without stealing energy from the court.", "Zwei Ganzkörper-Einheiten bauen Kraft auf, ohne dir die Energie fürs Feld zu rauben.") };
  return p.level === "Beginner" ? { n: 2, why: L("Two sessions to learn the lifts with clean form first.", "Zwei Einheiten, um die Übungen erst mit sauberer Technik zu lernen.") }
    : { n: 3, why: L("Three sessions let you split lower body, upper body and power.", "Mit drei Einheiten kannst du Unterkörper, Oberkörper und Explosivität aufteilen.") };
}
function recSolo(p, teamN) {
  let total = { Beginner: 4, Intermediate: 5, Advanced: 6 }[p.level];
  if (p.age === "U14") total = Math.min(total, 4);
  const n = Math.max(1, Math.min(4, total - teamN));
  return { n, why: L(`With ${teamN} team practice${teamN === 1 ? "" : "s"}, ${n} solo session${n === 1 ? "" : "s"} gets you to about ${teamN + n} basketball days. More than that and your legs won't recover.`,
    `Mit ${teamN} Teamtraining${teamN === 1 ? "" : "s"} kommst du mit ${n} Solo-Einheit${n === 1 ? "" : "en"} auf etwa ${teamN + n} Basketball-Tage. Mehr schaffen deine Beine nicht zu regenerieren.`) };
}

  `<button class="opt count-opt" data-${key}="${n}" aria-pressed="${cur === n}"><strong>${n}×</strong><span>${n === 0 ? L("None", "Keine") : L("per week", "pro Woche")}</span>${n === rec ? `<em class="rec">${L("Recommended", "Empfohlen")}</em>` : ""}</button>`).join("")}</div>`;

function showStart(on) {
  $("view-start").hidden = !on;
  $("tabbar").hidden = on;

  if (on) renderStart();
  window.scrollTo(0, 0);
}

function changeLine(c) {
  const name = `<b>${esc(tl(c.type))}</b>`;
  if (c.to !== c.from) return `${name}: ${lv(c.from)} → <span class="lv lv-${c.to[0]}">${lv(c.to)}</span> · ${c.why === "easy" ? L("you rated it too easy", "war dir zu leicht") : L("you rated it too hard", "war dir zu schwer")}`;
  if (c.why === "missed") return `${name}: ${L("not done last week, level stays", "letzte Woche nicht gemacht, Level bleibt")} ${lv(c.to)}`;
  if (c.why === "easy") return `${name}: ${L("already at the top level", "schon auf dem höchsten Level")}`;
  return `${name}: ${L("stays", "bleibt")} ${lv(c.to)} (${c.done}/${c.planned} ${L("done", "geschafft")})`;
}

function profileBlock() {
  const p = state.profile; if (!p) return "";
  const f = p.focus.map(v => { const x = FOCUS.find(y => y.v === v); return L(x.t, x.tde); }).join(", ");
  const team = p.team || [];
  const tip = p.level === "Beginner" && !state.log.length ? L("First week: do one set less than listed and focus on clean form.", "Erste Woche: einen Satz weniger als angegeben und auf saubere Technik achten.")
    : isYoung(p.age) && p.focus.includes("strength") ? L("Weighted gym work comes from U18 or with a coach. Your strength days use jumps, core and bodyweight work.", "Training mit Gewichten erst ab U18 oder mit einem Coach. Deine Krafttage bestehen aus Sprüngen, Rumpf und Körpergewichtsübungen.")
    : "";
  const sess = state.plan.filter(x => x.kind !== "team");
  const doneN = sess.filter((x) => logFor("p" + state.plan.indexOf(x))).length;
  const t = WEEK[todayIdx()];
  const banner = state.changes && state.changes.length && !state.changesSeen ? `

      <small>Team: ${team.length ? team.map(dy).join(", ") : L("none", "keins")} · Gym ${p.gym ?? "–"}× · Solo ${p.solo ?? "–"}×</small></div>
      <button class="linkbtn" data-edit="1">${L("Edit", "Ändern")}</button></div>

}

function renderToday() {
  if (!state.profile) { $("view-today").innerHTML = ""; return; }
  const w = getW(state.active);
  const total = w.drills.reduce((a, d) => a + d.sets, 0);
  const done = w.drills.reduce((a, d) => a + Math.min(state.done[doneKey(d.id)] || 0, d.sets), 0);
  const pct = total ? Math.round(done / total * 100) : 0;
  const log = logFor(slot());
  const RATES = [["easy", "Too easy", "Zu leicht"], ["ok", "Just right", "Genau richtig"], ["hard", "Too hard", "Zu schwer"]];
  $("view-today").innerHTML = `
    ${profileBlock()}
    <div class="hero">
      <div class="eyebrow">${state.activeIdx >= 0 && state.plan[state.activeIdx] && state.plan[state.activeIdx].id === state.active ? dy(state.plan[state.activeIdx].day) : L("Extra session", "Zusatzeinheit")} · ${esc(cat(w.cat))}</div>
      <h2>${esc(nm(w.name))}</h2>
      <div class="meta"><span>${w.min} min</span><span>${w.drills.length} ${L("drills", "Übungen")}</span><span>${esc(nm(w.level))}</span></div>
      <p class="q-help">${esc(tr(w.blurb))}</p>
      <div class="bar" aria-label="${L("Session progress", "Fortschritt")}"><i style="width:${pct}%"></i></div>
      <div class="meta"><span>${done} / ${total} ${L("sets done", "Sätze geschafft")}</span></div>
    </div>
    ${log ? `<div class="done-banner">
      <strong>${L("Session logged.", "Einheit gespeichert.")}</strong> ${L("How did it feel?", "Wie war's?")}
      <div class="rate">${RATES.map(([k, en, de]) => `<button class="ratebtn" data-rate="${k}" aria-pressed="${log.rating === k}">${L(en, de)}</button>`).join("")}</div>
      <small>${L("Your rating sets next week's level for this kind of session.", "Deine Bewertung bestimmt das Level dieser Einheit für nächste Woche.")}</small>
    </div>` : ""}
    <div class="drills">${w.drills.map(d => {
      const n = Math.min(state.done[doneKey(d.id)] || 0, d.sets), open = state.open === d.id;
      return `<div class="drill ${n === d.sets ? "complete" : ""}">
        <button class="drill-head" data-open="${d.id}" aria-expanded="${open}">
          <span class="drill-name">${esc(d.name)}</span>
          <span class="count">${n === d.sets ? "✓ " : ""}${n}/${d.sets}</span>
          <span class="drill-dose">${d.lvl ? `<span class="lv lv-${d.lvl[0]}">${lv(d.lvl)}</span> ` : ""}${esc(dose(d.dose))}</span>
        </button>
        ${open ? `<div class="drill-body">
          ${d.gym ? `<table class="gymtable"><tbody>${d.gym.map(r => `<tr><td>${esc(cell(r[0]))}</td><td>${esc(cell(r[1]))}</td></tr>`).join("")}</tbody></table>` : courtSVG(d)}
          <ul class="cues">${d.cues.map(c => `<li>${esc(tr(c))}</li>`).join("")}</ul>
          <div class="sets">${Array.from({ length: d.sets }, (_, i) =>
            `<button class="set" data-set="${d.id}" data-i="${i}" aria-pressed="${i < n}">${L("Set", "Satz")} ${i + 1}</button>`).join("")}</div>
        </div>` : ""}
      </div>`; }).join("")}
    </div>
    ${!log ? `<button class="btn ghost wide" data-alldone="1">${L("Mark whole session as done", "Ganze Einheit als erledigt markieren")}</button>` : ""}
    <p class="note">${L("Tap a drill to see the diagram and coaching cues. Tap a set when it's done. Finished sessions are saved and shape next week's plan.", "Tippe auf eine Übung für Skizze und Coaching-Tipps. Tippe auf einen Satz, wenn er geschafft ist. Fertige Einheiten werden gespeichert und formen den Plan für nächste Woche.")}</p>`;
}

function renderProgress() {
  if (!state.profile) { $("view-progress").innerHTML = ""; return; }
  const wk = state.log.filter(l => l.wk === state.weekKey);
  const planned = state.plan.filter(x => x.kind !== "team").length;
  const min = wk.reduce((a, l) => a + l.min, 0);
  const t = todayIdx(), monday = now(); monday.setDate(monday.getDate() - t);
  const letters = isDE() ? ["M","D","M","D","F","S","S"] : ["M","T","W","T","F","S","S"];
  const cells = WEEK.map((d, i) => {
    const date = new Date(monday); date.setDate(monday.getDate() + i);
    const n = wk.filter(l => l.d === ymd(date)).length;
    const sess = state.plan.filter(x => x.day === d && x.kind !== "team").length;
    const teamDay = state.plan.some(x => x.day === d && x.kind === "team");
    let cls = "", mark = "–";
    if (n) { cls = "on"; mark = n > 1 ? "✓" + n : "✓"; }
    else if (sess && i < t) { cls = "miss"; mark = "✕"; }
    else if (sess) { cls = "planned"; mark = "●"; }
    else if (teamDay) { cls = "teamd"; mark = "T"; }
    return `<div class="day ${cls}${i === t ? " now" : ""}"><small>${letters[i]}</small>${mark}</div>`;
  }).join("");
  const since = now(); since.setDate(since.getDate() - 29);
  const recent = state.log.filter(l => l.d >= ymd(since));
  const byCat = {};
  recent.forEach(l => { byCat[l.cat] = (byCat[l.cat] || 0) + l.min; });
  const totalMin = Object.values(byCat).reduce((a, b) => a + b, 0);
  const split = CAT_ORDER.filter(c => byCat[c]).map(c => [c, Math.round(byCat[c] / totalMin * 100)]);
  const types = [...new Set(state.plan.filter(x => x.type).map(x => x.type))];
  const rated = recent.filter(l => l.rating);
  const empty = !state.log.length;
  $("view-progress").innerHTML = `
    <div class="hero"><div class="eyebrow">${L("Progress", "Fortschritt")} · ${L("Week", "KW")} ${weekNum(state.weekKey)}</div><h2>${L("This week", "Diese Woche")}</h2></div>
    <div class="week">${cells}</div>
    <div class="legend"><span><i class="lg on"></i>${L("done", "geschafft")}</span><span><i class="lg planned"></i>${L("planned", "geplant")}</span><span><i class="lg miss"></i>${L("missed", "verpasst")}</span><span><i class="lg teamd"></i>${L("team", "Team")}</span></div>
    <div class="stats">
      <div class="stat"><b>${wk.length}/${planned}</b><span>${L("Sessions", "Einheiten")}</span></div>
      <div class="stat"><b>${min}</b><span>${L("Minutes", "Minuten")}</span></div>
      <div class="stat"><b>${streak()}</b><span>${L("Day streak", "Tage in Folge")}</span></div>
    </div>
    ${empty ? `<div class="tip">${L("Nothing logged yet. Finish your first session on Today, it will show up here. Every Monday your plan adapts to what you logged.", "Noch nichts gespeichert. Schließ deine erste Einheit auf „Heute“ ab, dann erscheint sie hier. Jeden Montag passt sich dein Plan an das an, was du gespeichert hast.")}</div>` : ""}
    <div class="eyebrow">${L("Your levels", "Deine Level")}</div>
    <div class="lvlist">${types.map(ty => { const l = lvlOf(state.profile, ty);
      return `<div class="lvrow"><span>${esc(tl(ty))}</span><span class="lv lv-${l[0]}">${lv(l)}</span></div>`; }).join("")}</div>
    <p class="note">${L("Rate finished sessions. Mostly “too easy” and most sessions done: the level goes up next week. Mostly “too hard”: it goes down.", "Bewerte fertige Einheiten. Meist „zu leicht“ und die meisten Einheiten geschafft: Nächste Woche steigt das Level. Meist „zu schwer“: Es sinkt.")}</p>
    ${split.length ? `<div class="eyebrow">${L("Training split · last 30 days", "Trainingsverteilung · letzte 30 Tage")}</div>
    <div class="split">${split.map(([k, v]) => `<div class="split-row"><span>${cat(k)}</span><div class="bar"><i style="width:${v}%"></i></div><em>${v}%</em></div>`).join("")}</div>
    <p class="note">${totalMin} ${L("minutes in", "Minuten in")} ${recent.length} ${L("sessions", "Einheiten")}${rated.length ? ` · ${L("ratings", "Bewertungen")}: ${rated.filter(l => l.rating === "easy").length}× ${L("too easy", "zu leicht")}, ${rated.filter(l => l.rating === "ok").length}× ${L("just right", "genau richtig")}, ${rated.filter(l => l.rating === "hard").length}× ${L("too hard", "zu schwer")}` : ""}</p>` : ""}
    ${state.history.length ? `<div class="eyebrow">${L("Past weeks", "Letzte Wochen")}</div>
    <div class="hist">${state.history.slice(0, 8).map(h => `<div class="histrow">
      <div><b>${L("Week", "KW")} ${weekNum(h.key)}</b><span>${h.done}/${h.planned} ${L("sessions", "Einheiten")} · ${h.min} min</span></div>
      <div class="bar"><i style="width:${h.planned ? Math.min(100, Math.round(h.done / h.planned * 100)) : 0}%"></i></div>
      ${h.changes.filter(c => c.to !== c.from).length ? `<small>${h.changes.filter(c => c.to !== c.from).map(c => `${esc(tl(c.type))} ${LV_LIST.indexOf(c.to) > LV_LIST.indexOf(c.from) ? "↑" : "↓"} ${lv(c.to)}`).join(" · ")}</small>` : ""}
    </div>`).join("")}</div>` : ""}
    <p class="note">${L("Your data is saved in this browser on this device only.", "Deine Daten werden nur in diesem Browser auf diesem Gerät gespeichert.")}</p>
    ${state.resetAsk ? `<div class="tip warn">${L("Delete all logged sessions, levels and your plan? This can't be undone.", "Alle gespeicherten Einheiten, Level und deinen Plan löschen? Das lässt sich nicht rückgängig machen.")}
      <div class="nav-row" style="margin-top:10px"><button class="btn ghost" data-resetno="1">${L("Cancel", "Abbrechen")}</button><button class="btn" data-resetyes="1">${L("Delete everything", "Alles löschen")}</button></div></div>`
      : `<button class="linkbtn" data-reset="1">${L("Reset all data", "Alle Daten zurücksetzen")}</button>`}`;
}

function setTab(t) {
  ["today","library","progress"].forEach(x => {
    $("view-" + x).hidden = x !== t;
    $("tab-" + x).setAttribute("aria-selected", x === t);
  });
  window.scrollTo(0, 0);
}

document.addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.tab) return setTab(b.dataset.tab);
  if (b.dataset.dev) {
    const v = b.dataset.dev;
    if (v === "day") state.dayOffset = (state.dayOffset || 0) + 1;
    if (v === "week") state.dayOffset = (state.dayOffset || 0) + 7;
    if (v === "back") state.dayOffset = (state.dayOffset || 0) - 1;
    if (v === "today") state.dayOffset = 0;
    if (v === "off") { devMode(false); return renderDev(); }
    weekRoll(); if (state.profile) pickDefault(); save(); renderAll(); return renderDev();
  }
  if (b.dataset.lang) { state.lang = state.lang === "de" ? "en" : "de"; save(); return renderAll(); }
  const d = state.draft;
  if (b.dataset.age) { d.age = b.dataset.age; return renderStart(); }
  if (b.dataset.level) { d.level = b.dataset.level; return renderStart(); }
  if (b.dataset.focus) {
    const v = b.dataset.focus, i = d.focus.indexOf(v);
    if (i >= 0) d.focus.splice(i, 1); else if (d.focus.length < 3) d.focus.push(v);
    return renderStart();
  }
  if (b.dataset.team) {
    const i = d.team.indexOf(b.dataset.team);
    if (i >= 0) d.team.splice(i, 1); else d.team.push(b.dataset.team);
    d.team.sort((x, y) => WEEK.indexOf(x) - WEEK.indexOf(y));
    return renderStart();
  }
  if (b.dataset.gym !== undefined) { d.gym = +b.dataset.gym; return renderStart(); }
  if (b.dataset.solo !== undefined) { d.solo = +b.dataset.solo; return renderStart(); }
  if (b.dataset.step) {
    state.step += b.dataset.step === "next" ? 1 : -1;
    if (state.step === 4 && d.gym === null) d.gym = recGym(d).n;
    if (state.step === 5 && d.solo === null) d.solo = recSolo(d, d.team.length).n;
    return renderStart();
  }
  if (b.dataset.build) {
    state.profile = { age: d.age, level: d.level, focus: [...d.focus], team: [...d.team], gym: d.gym, solo: d.solo };
    state.levels = {}; state.changes = []; state.changesSeen = true;
    newPlanFor(weekInfo());
    save(); renderAll(); return showStart(false);
  }
  if (b.dataset.edit) {
    const pr = state.profile;
    state.draft = { age: pr.age, level: pr.level, focus: [...pr.focus], team: [...(pr.team || [])], gym: pr.gym ?? null, solo: pr.solo ?? null };
    state.step = 0; return showStart(true);
  }
  if (b.dataset.planpick) {
    const i = +b.dataset.planpick; state.activeIdx = i; state.active = state.plan[i].id;
    const w = getW(state.active); state.open = w.drills[0] ? w.drills[0].id : null; save(); renderLibrary(); return renderToday();
  }
  if (b.dataset.open) { state.open = state.open === b.dataset.open ? null : b.dataset.open; return renderToday(); }
  if (b.dataset.set) {
    const k = doneKey(b.dataset.set), i = +b.dataset.i, cur = state.done[k] || 0;
    state.done[k] = i < cur ? i : i + 1;
    syncLog(); save(); renderChrome(); renderProgress(); return renderToday();
  }
  if (b.dataset.alldone) {
    getW(state.active).drills.forEach(dr => { state.done[doneKey(dr.id)] = dr.sets; });
    syncLog(); save(); renderChrome(); renderProgress(); renderToday(); return window.scrollTo(0, 0);
  }
  if (b.dataset.rate) {
    const l = logFor(slot()); if (l) l.rating = l.rating === b.dataset.rate ? null : b.dataset.rate;
    save(); renderProgress(); return renderToday();
  }
  if (b.dataset.dismiss) { state.changesSeen = true; save(); return renderToday(); }
  if (b.dataset.reset) { state.resetAsk = true; return renderProgress(); }
  if (b.dataset.resetno) { state.resetAsk = false; return renderProgress(); }
  if (b.dataset.resetyes) {
    try { localStorage.removeItem("hw-state"); } catch (err) {}
    const lang = state.lang;
    Object.assign(state, JSON.parse(JSON.stringify(DEFAULTS)), { lang });
    save(); renderAll(); return showStart(true);
  }
  if (b.dataset.filter) { state.filter = b.dataset.filter; state.sub = "All"; save(); return renderLibrary(); }
  if (b.dataset.sub) { state.sub = b.dataset.sub; return renderLibrary(); }
  if (b.dataset.lvl) { state.lvl = b.dataset.lvl; return renderLibrary(); }
  if (b.dataset.mode) { state.mode = b.dataset.mode; state.libOpen = null; return renderLibrary(); }
  if (b.dataset.libopen) { state.libOpen = state.libOpen === b.dataset.libopen ? null : b.dataset.libopen; return renderLibList(); }
  if (b.dataset.pick) {
    state.active = b.dataset.pick; state.activeIdx = state.plan.findIndex(p => p.id === state.active); state.open = getW(state.active).drills[0].id;
    if (!state.profile) return;
    save(); renderToday(); renderLibrary(); return setTab("today");
  }
  if (b.dataset.go) return setTab(b.dataset.go);
});

function devMode(on) { try { on ? localStorage.setItem("hw-dev", "1") : localStorage.removeItem("hw-dev"); } catch (e) {} }
function renderDev() {
  const bar = $("devBar"), on = devOn();
  bar.hidden = !on;
  if (!on) return;
  const d = now(), off = state.dayOffset || 0;
  bar.innerHTML = `<span><b>DEV</b> ${dy(WEEK[todayIdx()])} ${String(d.getDate()).padStart(2, "0")}.${String(d.getMonth() + 1).padStart(2, "0")}. · ${L("Week", "KW")} ${weekInfo().n}${off ? ` · ${off > 0 ? "+" : ""}${off}d` : ""}</span>
    <button data-dev="back">−1</button><button data-dev="day">+1 ${L("day", "Tag")}</button><button data-dev="week">+1 ${L("week", "Woche")}</button>
    <button data-dev="today">${L("Real date", "Echtes Datum")}</button><button data-dev="off" aria-label="${L("Hide dev tools", "Dev-Tools ausblenden")}">✕</button>`;
}
function checkDevHash() {
  if (location.hash === "#dev") devMode(true);
  if (location.hash === "#nodev") devMode(false);
}
checkDevHash();
window.addEventListener("hashchange", () => { checkDevHash(); renderDev(); });
weekRoll();
if (state.profile && !(state.plan[state.activeIdx] && state.plan[state.activeIdx].id === state.active) && !W.find(w => w.id === state.active)) pickDefault();
renderAll();
renderDev();
if (!state.profile) showStart(true);
// A new week can start while the page stays open in the background
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && state.profile && weekInfo().key !== state.weekKey) { weekRoll(); renderAll(); }
});
</script>

</body>
</html>
